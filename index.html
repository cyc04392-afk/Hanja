<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>먹빛 한자</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="먹빛 한자"><meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#15151F" media="(prefers-color-scheme: dark)"><style>:root{color-scheme:light}body{margin:0}@media (prefers-color-scheme:dark){:root{color-scheme:dark}}img{max-width:100%}[hidden]{display:none!important}
@font-face{font-family:"Nunito";src:url(fonts/nunito.woff2) format("woff2");font-weight:200 1000;font-display:swap}
@font-face{font-family:"Noto Serif KR";src:url(fonts/serif-han.woff2) format("woff2");font-weight:100 900;font-display:block}
/* Layout: one phone-width study column. A soft panel with the mascot and a floating pill button leads the home tab; list rows below; fixed icon tab bar. */
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --sunk:#F2F3FA;
  --ink:#2A2B3F; --ink-2:#5B5D78; --ink-3:#9B9DB6; --line:#E8E9F3;
  --indigo:#7667E6; --indigo-weak:#EEECFC; --on-indigo:#FFFFFF; --indigo-2:#A98CF0; --badge:#B7A9F3;
  --seal:#F2783C; --on-seal:#FFFFFF;
  --ok:#22A873; --ok-weak:#E2F6EC; --bad:#E9544F; --bad-weak:#FDE9E7;
  --sound:#B97800; --sound-weak:#FFF3D6;
  --shadow:0 2px 6px rgba(88,76,180,.08),0 12px 28px rgba(88,76,180,.14);
  --f-ui:"Nunito","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-han:"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","Batang","Songti SC","PMingLiU",serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15151F; --surface:#1E1E2C; --sunk:#232334;
  --ink:#ECECF6; --ink-2:#B5B6CC; --ink-3:#7E8099; --line:#30314A;
  --indigo:#9D90F5; --indigo-weak:#2A2748; --on-indigo:#14122B; --indigo-2:#C0A8F8; --badge:#5E53A8;
  --seal:#FF9460; --on-seal:#2A1206;
  --ok:#54CC98; --ok-weak:#143325; --bad:#F5857F; --bad-weak:#3B1A1A;
  --sound:#E8B553; --sound-weak:#3A2D10;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.4);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#15151F; --surface:#1E1E2C; --sunk:#232334;
  --ink:#ECECF6; --ink-2:#B5B6CC; --ink-3:#7E8099; --line:#30314A;
  --indigo:#9D90F5; --indigo-weak:#2A2748; --on-indigo:#14122B; --indigo-2:#C0A8F8; --badge:#5E53A8;
  --seal:#FF9460; --on-seal:#2A1206;
  --ok:#54CC98; --ok-weak:#143325; --bad:#F5857F; --bad-weak:#3B1A1A;
  --sound:#E8B553; --sound-weak:#3A2D10;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.4);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h2{font-size:17px;font-weight:700;text-wrap:balance}
h3{font-size:14px;font-weight:700;color:var(--ink)}
.han{font-family:var(--f-han);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .small{font-size:13px}

#app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 96px;min-height:100%}
.top{display:flex;align-items:center;gap:14px;padding-block:12px 10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-3)}
.stagebtn{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:13px}
.sync{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)} .sync.on i{background:var(--ok)}

/* seal stamp: the grade mark */
.stamp{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 8px;background:var(--badge);color:#fff;font-weight:800;font-size:12px;border-radius:999px;line-height:1;white-space:nowrap}
.stamp.lg{height:38px;min-width:38px;font-size:16px;font-family:var(--f-han);background:var(--indigo);color:var(--on-indigo)}
.stamp.ghost{background:var(--indigo-weak);color:var(--indigo)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{padding:8px 0 7px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--ink-3);font-weight:600;position:relative}
.tabs button svg{width:24px;height:24px;display:block}
.tabs button[aria-current="true"]{color:var(--indigo)}
.tabs button[aria-current="true"] svg .f{fill:currentColor;fill-opacity:.9}
.tabs .dot{position:absolute;left:50%;margin-left:6px;top:4px;min-width:16px;height:16px;border-radius:8px;background:var(--seal);color:var(--on-seal);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;background:linear-gradient(90deg,var(--indigo),var(--indigo-2));color:var(--on-indigo);box-shadow:0 6px 14px rgba(118,103,230,.28)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--surface);color:var(--indigo);box-shadow:inset 0 0 0 1.5px var(--indigo-weak)}
.btn.quiet{background:var(--sunk);color:var(--ink-2);box-shadow:none}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"],.chip.on{background:var(--indigo);color:var(--on-indigo);border-color:var(--indigo)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 4px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--indigo);box-shadow:0 1px 3px rgba(88,76,180,.16)}

/* home */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-size:22px;font-weight:600;line-height:1} .ring small{font-size:11px;color:var(--ink-3);display:block;text-align:center}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{min-width:0} .kv b{display:block;font-size:19px;font-weight:600;line-height:1.2} .kv span{font-size:12px;color:var(--ink-3)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){ .types{grid-template-columns:repeat(2,1fr)} }
.type{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;display:grid;gap:2px;min-width:0}
.type b{font-size:14px;font-weight:600} .type span{font-size:12px;color:var(--ink-3)}
.type .han{font-size:20px;color:var(--indigo);line-height:1.1;margin-bottom:3px}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--indigo-2));border-radius:4px}
.banner{display:flex;gap:12px;align-items:center;background:var(--indigo-weak);border-radius:var(--r);padding:14px 16px}
.banner p{flex:1;min-width:0;font-size:14px}

/* reading */
.plist{display:grid;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 16px;width:100%}
.pitem .k{font-size:11px;color:var(--indigo);font-weight:600;letter-spacing:.04em}
.pitem b{display:block;font-weight:600}
.pitem .done{color:var(--ok);font-size:12px;font-weight:600}
.passage{font-family:var(--f-han);font-weight:500;font-size:19px;line-height:2.5;word-break:keep-all;overflow-wrap:anywhere}
.passage.noruby{line-height:2.05}
.passage ruby{ruby-position:over}
.passage rt{font-family:var(--f-ui);font-size:11px;color:var(--ink-3);font-weight:500;user-select:none}
.passage.noruby rt{display:none}
.hj{cursor:pointer;border-radius:4px}
.passage .hj{border-bottom:1.5px solid var(--line);padding-bottom:1px}
.passage .hj:hover,.hj:hover{background:var(--indigo-weak)}
.passage .hj.new{border-bottom-color:var(--seal)}

/* dictionary */
.search{width:100%;height:48px;border-radius:999px;border:1.5px solid var(--line);background:var(--sunk);padding:0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.cell{aspect-ratio:1;display:grid;place-items:center;font-family:var(--f-han);font-size:24px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:12px;position:relative;max-width:100%}
.cell[data-m="1"]{background:var(--indigo-weak)}
.cell[data-m="2"]{background:var(--indigo);color:var(--on-indigo);border-color:var(--indigo)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px;background:var(--surface)}

/* idiom card */
.idiom{display:grid;gap:10px}
.scene{border-radius:16px;overflow:hidden;aspect-ratio:360/150;background:linear-gradient(180deg,var(--indigo-weak),var(--sunk));--surface-x:var(--sunk)}
.scene svg{display:block;width:100%;height:100%}
.scene .i1{fill:var(--ink)} .scene .i2{fill:var(--ink);fill-opacity:.55} .scene .i3{fill:var(--ink);fill-opacity:.24} .scene .i4{fill:var(--ink);fill-opacity:.1}
.scene .pp{fill:var(--sunk)} .scene .ac{fill:var(--seal)} .scene .ind{fill:var(--indigo)} .scene .ind2{fill:var(--indigo);fill-opacity:.3}
.scene .s1,.scene .s2,.scene .s3,.scene .sa,.scene .si,.scene .sp{fill:none;stroke-linecap:round;stroke-linejoin:round}
.scene .s1{stroke:var(--ink)} .scene .s2{stroke:var(--ink);stroke-opacity:.55} .scene .s3{stroke:var(--ink);stroke-opacity:.24}
.scene .sa{stroke:var(--seal)} .scene .si{stroke:var(--indigo)} .scene .sp{stroke:var(--sunk)}
.ihead{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.ich{display:grid;justify-items:center;gap:0}
.ich b{font-family:var(--f-han);font-size:34px;font-weight:700;line-height:1.15}
.ich small{font-size:12px;color:var(--ink-3)}

/* confusable */
.cmp{display:flex;gap:8px;flex-wrap:wrap}
.cmp button{flex:1 1 84px;min-width:0;background:var(--sunk);border-radius:12px;padding:10px 6px 8px;display:grid;justify-items:center;gap:2px}
.cmp button b{font-family:var(--f-han);font-size:54px;font-weight:500;line-height:1.1}
.cmp button small{font-size:12px;color:var(--ink-2);text-align:center}
.overlay{position:relative;height:150px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.overlay b{position:absolute;font-family:var(--f-han);font-size:120px;font-weight:500;line-height:1;opacity:.62}
.overlay b:nth-child(1){color:var(--indigo)} .overlay b:nth-child(2){color:var(--seal)} .overlay b:nth-child(3){color:var(--ok)} .overlay b:nth-child(4){color:var(--sound)} .overlay b:nth-child(5){color:var(--ink-3)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,26,70,.45)}
.sheet{width:100%;max-width:680px;max-height:92%;min-height:72%;background:var(--paper);border-radius:26px 26px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){ #sheet{align-items:center} .sheet{border-radius:20px;max-height:88%} }
.sheet-head{padding:10px 12px 8px;display:flex;align-items:center;gap:8px}
.sheet-head .seg{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--ink-3);flex:none}
.iconbtn:hover{background:var(--sunk)}
.sheet-body{overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .big{font-family:var(--f-han);font-size:88px;font-weight:600;line-height:1;width:112px;height:112px;display:grid;place-items:center;background:var(--sunk);border-radius:24px}
.hero h2{font-size:22px;font-weight:800;line-height:1.3}
.facts{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:6px}
.facts b{color:var(--ink);font-weight:600}
.sec{display:grid;gap:9px}
.evo{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,112px));gap:18px}
.evo .kai{font-size:clamp(30px,9vw,46px);line-height:1}
.evo .tile{aspect-ratio:1;background:var(--sunk);border-radius:16px;display:grid;place-items:center;padding:8px;min-width:0;max-width:100%;position:relative}
.evo .tile svg{width:100%;height:100%;display:block}
.evo .tile.none{border-style:dashed;background:transparent;color:var(--ink-3);font-size:11px;line-height:1.3;text-align:center;padding:4px;word-break:keep-all}
.evo figure + figure .tile::before{content:"→";position:absolute;left:-15px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:11px;font-family:var(--f-ui)}
.evo figure{margin:0;display:grid;gap:5px;min-width:0}
.evo figcaption{font-size:12px;text-align:center;color:var(--ink-2);line-height:1.3}
.evo figcaption small{display:block;color:var(--ink-3);font-size:11px}
.why{font-size:15px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--indigo-weak);color:var(--indigo);vertical-align:1px;margin-right:6px;white-space:nowrap}
.parts{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.part{flex:1 1 96px;min-width:0;border-radius:16px;padding:10px 12px;display:grid;gap:1px;justify-items:start;text-align:left;background:var(--sunk)}
.part b{font-family:var(--f-han);font-size:30px;font-weight:600;line-height:1.15}
.part span{font-size:12px;color:var(--ink-2)}
.part em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.03em}
.part.mean{background:var(--indigo-weak);border-color:transparent} .part.mean em{color:var(--indigo)}
.part.sound{background:var(--sound-weak);border-color:transparent} .part.sound em{color:var(--sound)}
.plus{align-self:center;color:var(--ink-3);font-weight:600}
.fam{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fam button{display:grid;justify-items:center;min-width:46px;padding:5px 4px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.fam button b{font-family:var(--f-han);font-size:24px;font-weight:600;line-height:1.15}
.fam button small{font-size:11px;color:var(--ink-3)}
.fam button.key{background:var(--sound-weak);border-color:transparent}
.fam button.key small,.fam small.same{color:var(--sound);font-weight:700}
.fam button.me{box-shadow:inset 0 0 0 2px var(--indigo)}
.stroke{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.stroke .pad{width:150px;height:150px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;position:relative;overflow:hidden}
.pad::before,.pad::after{content:"";position:absolute;pointer-events:none;border:0 dashed var(--line)}
.pad::before{left:50%;top:0;bottom:0;border-left-width:1px}
.pad::after{top:50%;left:0;right:0;border-top-width:1px}
.pad > *{position:relative;z-index:1}
.stroke .ctl{display:flex;gap:6px;flex-wrap:wrap}
.jp{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.jp .shin{display:flex;align-items:center;gap:8px;font-family:var(--f-han);font-size:40px;font-weight:600;line-height:1}
.jp .shin i{font-style:normal;font-size:16px;color:var(--ink-3)}
.jp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px}
.jp dt{color:var(--ink-3);font-size:12px;padding-top:2px} .jp dd{margin:0;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",var(--f-han);font-weight:500}
.word{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.word:first-child{border-top:0;padding-top:2px}
.word .w{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.word .w b{font-family:var(--f-han);font-size:24px;font-weight:600}
.word .eq{font-size:13px;color:var(--ink-2)}
.word .eq b{font-family:var(--f-han);font-weight:600;color:var(--ink)}
.pin{font-size:11px;font-weight:800;color:var(--seal)}
.empty{padding:28px 8px;text-align:center;color:var(--ink-3);font-size:14px}

/* session */
#session{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.q-top{display:flex;align-items:center;gap:10px;padding:10px 12px;max-width:680px;width:100%;margin:0 auto}
.q-top .bar{flex:1;height:10px;border-radius:5px}
.q-top .bar i{transition:width .25s}
.combo{font-size:12px;font-weight:800;color:var(--ink-3);min-width:54px;text-align:right}
.combo.hot{color:var(--seal);font-weight:700}
.q-body{flex:1;overflow-y:auto;padding:6px 16px 20px;max-width:680px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.q-kind{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:700}
.q-stem{display:grid;justify-items:center;gap:8px;padding:22px 12px 18px;text-align:center;background:var(--sunk);border-radius:24px}
.q-stem .x{font-family:var(--f-han);font-weight:600;font-size:64px;line-height:1.15;word-break:keep-all}
.q-stem .x.w{font-size:52px} .q-stem .x.l{font-size:40px} .q-stem .x.kr{font-family:var(--f-ui);font-size:32px;font-weight:800}
.q-stem .x .blank{display:inline-block;width:.95em;height:.95em;border:2.5px dashed var(--indigo);border-radius:12px;vertical-align:-.12em;margin:0 .04em;background:var(--surface)}
.q-stem p{color:var(--ink-2);max-width:34em;text-wrap:balance}
.opts{display:grid;gap:8px}
.opts.c2{grid-template-columns:1fr 1fr}
.opt{min-height:56px;padding:10px 16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);text-align:left;font-weight:600;display:flex;align-items:center;gap:10px;min-width:0;box-shadow:0 2px 0 var(--line)}
.opt.h{justify-content:center;font-family:var(--f-han);font-size:30px;font-weight:600;min-height:72px}
.opt.hw{justify-content:center;font-family:var(--f-han);font-size:24px;font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--ok-weak)} .opt.no{border-color:var(--bad);background:var(--bad-weak)}
.opt:disabled{cursor:default}

/* ============ spaced repetition ============ */
/* item: [box, dueMin, nCorrect, nWrong, lastMin, maxBox]

const lvOfGrade = g => (GRADE_LV[g][0] + GRADE_LV[g][1]) / 2;

/* 나의 한자력 레벨 = 각 레벨에서 익힌 글자(숙달 단계 이상)가 기준치에 얼마나 찼는지를 1~30 레벨에 걸쳐 더한 값.
   레벨마다 12자(그 레벨 글자가 12자보다 적으면 전부)를 익히면 한 레벨이 찬다. 틀려서 숙달이 풀리면 그만큼 내려간다. */

function recordAnswer(q, ok, hinted) {

      else if (!was) it[0] = 1;                       // 힌트 보고 맞힘 → 내일
      else if (hinted) it[0] = Math.min(it[0] + 1, 3); // 힌트 도움: 7일까지만
      else it[0] = Math.min(7, it[0] + (it[0] >= 4 ? 1 : 2) + (it[3] === 0 && it[0] >= 2 ? 1 : 0)); // 실수 없이 이어가면 한 칸 더

    it[1] = now + IV[it[0]]; it[4] = now; it[5] = Math.max(it[5] || 0, it[0]); S.items[key] = it; cloud.dirty.add('it' + shardOf(key));

function startLevelTest() {

    gen: () => (++n < N ? mk() : null),
    onAnswer: (q, ok) => { hist.push(L); L = Math.max(0, Math.min(12.4, L + (ok ? step : -step))); step = Math.max(1, step * 0.82); },

  <div class="card"><div class="row" style="margin-bottom:4px"><h2 class="grow">오답 노트 <span class="muted num" style="font-weight:400">${S.wrong.length}</span></h2>${S.wrong.length ? '<button class="btn sm" data-go="rewrong">다시 풀기</button>' : ''}</div>
  ${S.wrong.length ? S.wrong.slice(0, 60).map(w => `<div class="wrongitem"><div class="t">${TYPES[w.t] ? TYPES[w.t].n : ''}</div><div class="s">${hjs(w.s)}</div><div class="small">정답 <b class="han" style="font-size:16px">${esc(w.a)}</b></div></div>`).join('') : '<div class="empty">틀린 문제가 여기에 모입니다. 다시 맞히면 사라집니다.</div>'}</div></div>`;
}
function viewStats(st) {
  const rows = []; for (let g = 0; g <= st.max; g++) { const cs = D.chars.filter(x => x.g === g); const m = cs.filter(x => mastery(x) === 2).length; rows.push(`<div class="gradebar"><span>${GR[g]}</span><div class="bar"><i style="width:${100 * m / cs.length}%"></i></div><span class="num">${m} / ${cs.length}</span></div>`); }
  const days = []; const d = new Date(); d.setDate(d.getDate() - 6); let mx = S.goal;
  for (let i = 0; i < 7; i++) { const k = dayKey(d); const n = (S.days[k] || [0])[0]; mx = Math.max(mx, n); days.push([['일', '월', '화', '수', '목', '금', '토'][d.getDay()], n]); d.setDate(d.getDate() + 1); }
  let exp = 0, known = 0; const trs = TYPE_ORDER.map(t => { const a = S.types[t]; const n = st.dist[t]; if (a && a[1] >= 3) { exp += n * a[0] / a[1]; known += n; } return `<tr><td>${TYPES[t].n}</td><td class="num">${n}</td><td class="num">${a ? a[0] + ' / ' + a[1] : '—'}</td><td class="num">${a && a[1] ? Math.round(100 * a[0] / a[1]) + '%' : '—'}</td></tr>`; }).join('');
  const est = known >= st.total * 0.6 ? Math.round(exp / known * st.total) : null;
  let totN = 0, totS = 0; Object.values(S.days).forEach(d => { totN += d[0]; totS += d[6] || 0; }); const td = todayRec();
  return `<div class="stack">
  <div class="card stack" style="gap:12px"><h2 style="text-align:center">한자 학습 정보</h2>
    <div class="stat4"><div><span class="k">${IC.trophy}연속 학습</span><b class="num">${streak()}일</b></div><div><span class="k">${IC.star}총 학습 문제</span><b class="num">${totN.toLocaleString()}</b></div><div><span class="k"><i class="dotc" style="background:var(--ok)"></i>오늘 학습 시간</span><b class="num">${fmtSecs(td[6])}</b></div><div><span class="k"><i class="dotc" style="background:var(--seal)"></i>총 학습 시간</span><b class="num">${fmtSecs(totS)}</b></div></div>
    ${histChart()}</div>
  <div class="card stack" style="gap:10px"><h2>나의 한자력 레벨</h2><div class="row"><b class="num" style="font-size:28px;font-weight:800;color:var(--indigo)">${S.lv ? userLv().toFixed(1) : '—'}</b><div class="grow small muted">${S.lv ? GR[gradeOfLv(userLv())] + ' 배정한자 수준. 레벨마다 글자 ' + LV_NEED + '자를 익히면(숙달 단계 이상) 한 레벨이 찹니다. 틀려서 숙달이 풀리면 그만큼 내려갑니다.' : '학습을 시작하면 매겨집니다. 레벨 테스트를 보면 아는 급수를 한 번에 채울 수 있습니다.'}</div></div><div class="bar"><i style="width:${S.lv ? userLv() / 30 * 100 : 0}%"></i></div>
    ${lvLadder()}</div>
  <div class="card stack" style="gap:10px"><h2>${st.id} 예상 점수</h2>${est == null ? '<p class="small muted">유형별로 세 문제 이상씩 풀면, 내 정답률에 실제 배점을 곱해 예상 점수를 냅니다.</p>' : `<div class="row"><span class="stamp lg">${est >= st.pass ? '合' : '否'}</span><div class="grow"><b class="num" style="font-size:24px">${est}점</b> <span class="muted">/ ${st.total}점 · 합격선 ${st.pass}점</span></div></div>`}
    <div class="scroll-x"><table class="tbl"><tr><th>유형</th><th>시험 문항</th><th>맞음 / 푼 문제</th><th>정답률</th></tr>${trs}</table></div></div>
  <div class="card stack" style="gap:10px"><h2>최근 7일</h2><div class="days">${days.map(([n, c]) => `<div><span class="num">${c || ''}</span><i class="${c ? '' : 'z'}" style="height:${Math.round(60 * c / mx)}px"></i>${n}</div>`).join('')}</div></div>
  <div class="card stack" style="gap:8px"><h2>급수별 익힌 글자</h2>${rows.join('')}</div>
  <div class="card"><h2 style="margin-bottom:4px">설정</h2>
    <div class="switch"><div><b>학습 기록 저장 위치</b><div class="small muted">${cloud.on ? 'Claude 계정에 저장되어 다른 기기에서도 이어집니다.' : '이 기기 안에만 저장됩니다. 앱 데이터를 지우면 함께 사라집니다.'}</div></div></div>
    <div class="switch"><div><b>유형별 연습을 직접 써서 답하기</b><div class="small muted">켜면 독음은 입력하고 한자는 손으로 씁니다. 끄면 객관식으로 나옵니다. 오늘의 학습과 복습은 항상 훈음 주관식입니다.</div></div><button data-go="real" aria-pressed="${S.real}" aria-label="실전 모드"></button></div>
    <div class="switch"><div><b>하루 목표</b><div class="small muted">오늘 푼 문제 수 기준</div></div><div class="seg" style="min-width:150px">${[15, 30, 60].map(n => `<button data-goal="${n}" aria-pressed="${S.goal === n}">${n}</button>`).join('')}</div></div>
    <div class="switch"><div><b>학습 기록 지우기</b><div class="small muted">익힌 글자, 오답 노트, 연속 학습일이 모두 사라집니다.</div></div><span id="reset-box"><button class="btn sm quiet" style="width:auto;height:36px;border-radius:10px" data-go="reset1">지우기</button></span></div></div>
  <div class="card credits"><h3>자료 출처</h3>
    <p>배정한자 3,500자와 대표훈음·부수·획수: 한국어문회 급수별 선정한자 (rycont/hanja-grade-dataset 정리본, 저작권 한국어문회).</p>
    <p>획순: Make Me a Hanzi · Hanzi Writer(Arphic 공개 글꼴 기반), AnimCJK(Arphic PL · LGPL), 그래도 없는 일부 글자는 KanjiVG(CC BY-SA 3.0, © Ulrich Apel)의 획 중심선을 획 모양으로 바꾸거나 다른 글자의 부분 획을 조합해 사용.</p>
    <p>갑골문: Li, Qing-sheng &amp; Bian, Yu-lin (2026), <i>Oracle Bone Glyphs: Parametric Vector Dataset (v0.3)</i>, doi:10.5281/zenodo.22467946, CC BY 4.0. 여기에 없는 글자는 아래 Wikimedia Commons 자형으로 채웠습니다.</p>
    <p>금문(및 일부 갑골문·소전): Wikimedia Commons 〈Ancient Chinese characters project〉의 자형 그림(Richard Sears 기증 자료 기반)을 윤곽선으로 다시 따서 실었습니다.</p>
    <p>소전: 開元小篆 Kaiyuan Small Seal Font (SIL OFL 1.1) — 《설문해자》 진창치본 목판 자형을 따 그린 것으로, 좌표를 줄여 실었습니다. 검수가 끝나지 않은 글꼴이라 일부 자형이 어긋날 수 있습니다.</p>
    <p>일본어 음훈: KANJIDIC2(© EDRDG, CC BY-SA 4.0), 신자체 대응: kyujitai.js. 부건 분해 참고: Make Me a Hanzi, Unicode Unihan.</p>
    <p>자원 풀이, 낱말 뜻풀이, 사자성어 유래와 삽화, 반의어·유의어, 약자, 닮은 글자, 지문은 Claude가 작성했습니다. 예서 자형과 장단음 문제는 싣지 못했습니다.</p></div></div>`;
}

/* ============ actions ============ */
function qFromRe(re, st) {
  try {
    switch (re[0]) {
      case 'hun': return qHun(D.C.get(re[1]), st);
      case 'bus': return qBus(D.C.get(re[1]), st);
      case 'dok': return qDok(D.W.get(re[1]), st);
      case 'mean': return qMean(D.W.get(re[1]), st);
      case 'write': return qWrite(D.W.get(re[1]) || D.C.get(re[1]), st);
      case 'idiom': return qIdiom(D.idioms.find(i => i.h === re[1]), st);
      case 'abbr': return qAbbr([re[1], D.abbrOf.get(re[1])], st);
      case 'homo': return qHomo(D.homoBy.get(re[1]), st);
      case 'pair': { const p = D.pairs[re[1]].find(p => (re[1].endsWith('_c') ? [p[0], p[1]] : [p[0], p[2]]).sort().join('') === re[2]); return p ? qPair(re[1], p, st) : null; }
    }
  } catch (e) { /* fall through */ }
  return null;
}
function startType(types) {
  const st = stageOf(S.stage); const used = new Set(); const qs = [];
  for (let i = 0; i < 10; i++) { const q = genType(pick(types), st, used); if (q) qs.push(q); }
  startSession('type', qs, { again: () => startType(types) });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-go],[data-stage],[data-pstage],[data-passage],[data-dict],[data-grade],[data-goal],[data-list]'); if (!t || Q.on && $('#session').contains(t)) return;
  const d = t.dataset; const st = stageOf(S.stage);
  if (d.nav) return setTab(d.nav);
  if (d.list) { V.list = d.list; render(); return window.scrollTo(0, 0); }
  if (d.stage) { S.stage = d.stage; V.grade = null; V.pstage = null; touch('meta'); render(); if (!$('#modal').hidden) renderStart(); return; }
  if (d.pstage) { V.pstage = d.pstage; return render(); }
  if (d.passage) { V.passage = +d.passage; render(); return window.scrollTo(0, 0); }
  if (d.dict) { V.dict = d.dict; V.q = ''; V.more = 30; return render(); }
  if (d.grade) { V.grade = +d.grade; $('#dict-res').innerHTML = dictResults(st); return; }
  if (d.goal) { S.goal = +d.goal; touch('meta'); return render(); }
  switch (d.go) {
    case 'today': openStart('hun'); break;
    case 'start': { const n = M.n, kind = M.kind; S.todayN = n; saveLocal(); closeStart(); clearSession(); startSession('today', buildToday(st, n, kind), { kind, again: () => startSession('today', buildToday(stageOf(S.stage), n, kind), { kind }) }); break; }
    case 'todaywrite': openStart('write'); break;
    case 'resume': if (!resumeSession()) { toast('이어서 할 학습이 없습니다'); render(); } break;
    case 'gotoread': setTab('read'); break;
    case 'gotodict': setTab('dict'); break;
    case 'closestart': closeStart(); break;
    case 'stepup': M.n = Math.min(40, M.n + 5); renderStart(); break;
    case 'stepdown': M.n = Math.max(5, M.n - 5); renderStart(); break;
    case 'gostats': setTab('stats'); break;
    case 'mockpick': { const el = $('#mock-card'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); break; }
    case 'listback': V.list = null; render(); window.scrollTo(0, 0); break;
    case 'savedstudy': startSession('review', shuffle(S.saved).slice(0, 20).map(w => w.re && qFromRe(w.re, st)).filter(Boolean), {}); break;
    case 'liststudy': { const L = homeLists(st)[V.list]; if (L) startSession('review', shuffle(L.list).slice(0, 15).map(x => qForChar(x, st)), {}); break; }
    case 'level': startLevelTest(); break;
    case 'type': startType(d.type.split(',')); break;
    case 'mock': { const r = S.real; S.real = true; const qs = buildMock(st, +d.size); S.real = r; startSession('mock', qs, { limit: +d.size === st.total ? st.min : 0 }); break; }
    case 'review': startSession('review', dueKeys(st).slice(0, 20).map(x => qForChar(x, st)), {}); break;
    case 'rewrong': startSession('review', S.wrong.slice(0, 15).map(w => w.re && qFromRe(w.re, st)).filter(Boolean), {}); break;
    case 'plist': V.passage = null; render(); break;
    case 'ruby': S.ruby = !S.ruby; touch('meta'); render(); break;
    case 'pread': { const p = D.passages[V.passage]; S.read[p.t] = S.read[p.t] ? 0 : 1; touch('meta'); render(); break; }
    case 'pquiz': { const p = D.passages[V.passage]; const pst = stageOf(p.s); const ws = uniq((p.x.match(/\[([^\]|]+)\|([^\]]+)\]/g) || [])).map(s => { const m = s.match(/\[([^\]|]+)\|([^\]]+)\]/); return D.W.get(m[1]) || { w: m[1], r: m[2], d: '', g: D.gmax(m[1]) }; }).filter(w => w.w.length > 1); startSession('type', shuffle(ws).slice(0, 10).map(w => qDok(w, pst)), {}); break; }
    case 'more': V.more += 30; $('#dict-res').innerHTML = dictResults(st); break;
    case 'real': S.real = !S.real; touch('meta'); render(); break;
    case 'morerev': S.moreRev = !S.moreRev; touch('meta'); render(); break;
    case 'reset1': $('#reset-box').innerHTML = '<button class="btn sm" style="width:auto;height:36px;border-radius:10px;background:var(--bad);color:var(--surface)" data-go="reset2">정말 지우기</button>'; break;
    case 'reset2': { const keep = { stage: S.stage, goal: S.goal, real: S.real, ruby: S.ruby }; S = Object.assign(defaultState(), keep); S.wts = Date.now(); for (let i = 0; i < SHARDS; i++) cloud.dirty.add('it' + i); cloud.dirty.add('wrong'); touch('meta'); render(); toast('학습 기록을 지웠습니다'); break; }
  }
});
let dictTimer = 0;

loadData().then(() => { S.lv = computeLv(); render(); initCloud(); fetch('data/illu.json').then(r => r.ok ? r.json() : null).then(j => { if (j) { D.illu = j; fillIllu(); } }).catch(() => {}); }).catch(err => { $('#view').innerHTML = `<div class="loading">자료를 불러오지 못했습니다. 새로 고침해 주세요.<br><span class="small">${esc(err.message)}</span></div>`; });

/* 90-day history: stacked bars (new / known at first sight / review) with review accuracy line */
function histChart() {
  const N = 90, days = []; const d = new Date(); d.setDate(d.getDate() - (N - 1));
  for (let i = 0; i < N; i++) { const r = S.days[dayKey(d)] || [0, 0, 0, 0, 0, 0, 0]; days.push(r); d.setDate(d.getDate() + 1); }
  const mx = Math.max(S.goal, ...days.map(r => r[0]));
  let rn = 0, rok = 0; days.forEach(r => { rn += r[4] || 0; rok += r[5] || 0; });
  const W = 360, H = 120, bw = W / N;
  const bars = days.map((r, i) => { const x = i * bw; const nw = Math.max(0, (r[2] || 0) - (r[3] || 0)), kn = r[3] || 0, rv = r[4] || 0, other = Math.max(0, r[0] - nw - kn - rv); const segs = [[other, 'var(--line)'], [rv, 'var(--badge)'], [kn, '#9ED8F5'], [nw, '#F6C453']]; let y = H; return segs.map(([v, col]) => { if (!v) return ''; const h = H * v / mx; y -= h; return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"/>`; }).join(''); }).join('');
  const pts = []; for (let i = 0; i < N; i++) { let a = 0, b = 0; for (let k = Math.max(0, i - 6); k <= i; k++) { a += days[k][5] || 0; b += days[k][4] || 0; } if (b) pts.push([(i + 0.35) * bw, H - H * a / b]); }
  const line = pts.length > 1 ? `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--indigo)" stroke-width="1.5"/>` : '';
  const lab = (() => { const t = new Date(); t.setDate(t.getDate() - 45); return dayKey(t); })();
  return `<div class="hist"><div class="row" style="justify-content:space-between;align-items:flex-start"><div class="info-legend"><span><i style="background:#F6C453"></i>새로 배운 글자: <b class="num">${days.reduce((s, r) => s + Math.max(0, (r[2] || 0) - (r[3] || 0)), 0)}</b></span><span><i style="background:#9ED8F5"></i>이미 아는 글자: <b class="num">${days.reduce((s, r) => s + (r[3] || 0), 0)}</b></span><span><i style="background:var(--badge)"></i>복습 글자: <b class="num">${rn}</b></span></div><div class="bigpct num"><span>복습 정답률</span>${rn ? Math.round(100 * rok / rn) : '—'}<small>%</small></div></div>
  <svg viewBox="0 0 ${W} ${H + 2}" preserveAspectRatio="none" role="img" aria-label="최근 90일 학습량과 복습 정답률">${bars}${line}</svg><div class="row small muted" style="justify-content:space-between"><span>90일 전</span><span>${lab}</span><span>오늘</span></div></div>`;
}

function lvLadder() {
  const t = lvTable();
  return `<div class="ladder">${Array.from({ length: 30 }, (_, i) => { const l = i + 1, p = t.need[l] ? Math.min(1, t.known[l] / t.need[l]) : 0; return `<div title="레벨 ${l}: 익힌 ${t.known[l]} / 필요 ${t.need[l]} (본 글자 ${t.seen[l]})"><i style="height:${Math.round(4 + 36 * p)}px;opacity:${p ? 1 : .25}"></i>${l % 5 === 0 || l === 1 ? `<span>${l}</span>` : ''}</div>`; }).join('')}</div><p class="small muted">막대 하나가 레벨 하나. 가득 차면 그 레벨을 익힌 것입니다.</p>`;
}
